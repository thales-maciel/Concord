name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  format:
    name: Formatting and packaging guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Test Windows GUI packaging guard
        run: python3 -m unittest discover -s tools -p test_verify_windows_gui.py -v

  portable:
    name: Portable libraries and server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Linux desktop support is not implemented yet.
      - name: Lint
        run: cargo clippy --locked -p voxhub-server -p vox-proto -p vox-log -p vox-capture --lib --bins --tests -- -D warnings
      - name: Test
        run: cargo test --locked -p voxhub-server -p vox-proto -p vox-log -p vox-capture --lib --bins --tests

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Xcode 15 on macos-14 cannot compile cxx's C++20 slice iterators.
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Both desktop workflows use this namespace; main warms it for PRs and version tags.
      # Cargo fingerprints keep dev/check, testing and shipping-release artifacts distinct.
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: desktop-v2
          cache-workspace-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report cache lookup
        run: echo "Desktop cache exact hit = ${{ steps.cache.outputs.cache-hit }} (see restore log for fallback hits)"
      - name: Discard restored timing reports
        shell: python
        run: |
          import shutil
          shutil.rmtree('target/cargo-timings', ignore_errors=True)
      - name: Lint full build (including GUI automation and CLI)
        run: cargo clippy --locked --workspace --all-features --lib --bins --tests --timings
      - name: Lint lightweight app
        run: cargo clippy --locked -p voxhub-app --no-default-features --bins --tests --timings
      - name: Test full build
        run: cargo test --locked --profile testing --workspace --all-features --lib --bins --tests --timings
      - name: Test lightweight denoiser and saved-preference fallback
        run: cargo test --locked --profile testing -p vox-client-core --no-default-features --lib audio::denoise --timings
      # Test harnesses are not the actual app. Build only that executable, not every workspace
      # binary again. Tags build the shipping app below instead of also building a testing app.
      - name: Build testing app
        if: runner.os != 'Windows' || !startsWith(github.ref, 'refs/tags/v')
        run: cargo build --locked --profile testing -p voxhub-app --timings
      - name: Build Windows release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        run: cargo build --locked --release -p voxhub-app --timings
      - name: Verify Windows client has no console subsystem
        if: runner.os == 'Windows'
        run: python tools/verify_windows_gui.py target/${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'testing' }}/concord.exe
      - name: Upload Cargo timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 14
      - name: Package Windows app
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Path dist/concord -Force | Out-Null
          Copy-Item target/release/concord.exe dist/concord/
          python tools/verify_windows_gui.py dist/concord/concord.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md dist/concord/
          Copy-Item docs/league-handoff.md dist/concord/LEAGUE-HANDOFF.md
          @'
          concord for Windows x64

          Extract this ZIP before running concord.exe. The binary is unsigned.
          Only bypass Windows warnings if you trust this download.

          League handoff is experimental and OFF by default. Enable it under:
          Settings > Video > League of Legends > Auto-switch client / game.
          Start a new stream after changing the setting. Prefer Borderless mode.
          See LEAGUE-HANDOFF.md for the test checklist and limitations.
          '@ | Set-Content dist/concord/README.txt
          Compress-Archive -Path dist/concord/* -DestinationPath "dist/concord-$env:RELEASE_TAG-windows-x64.zip"
      - name: Upload Windows package
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: concord-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release-tag:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version and main-branch ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit(f'Invalid release tag: {tag}')
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match workspace version {version}')
          PY

  release:
    name: Publish Windows download
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, portable, desktop, release-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: concord-windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          Windows x64 portable build. Extract the ZIP and run `concord.exe`.
          The executable is unsigned; only bypass Windows warnings if you trust this download.

          ### Experimental League of Legends screen-share handoff
          Off by default. Enable **Settings > Video > League of Legends > Auto-switch client / game**,
          then start sharing a League window. Video and requested app audio follow the client/game
          transition without restarting the stream. Borderless mode is recommended.

          Real-game Windows validation is still needed. The ZIP includes `LEAGUE-HANDOFF.md`
          with the acceptance checklist. Test in a practice game before relying on it.
          NOTES
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "concord $RELEASE_TAG" \
            --notes-file notes.md "${args[@]}"
